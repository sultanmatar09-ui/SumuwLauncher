name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          mkdir -p src_project
          unzip -o "*.zip" -d src_project
          ls -la src_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Patch & Build Debug APK
        run: |
          PROJ_DIR=$(find src_project -maxdepth 3 -name "settings.gradle*" -printf '%h\n' | head -n 1)
          echo "Project dir: $PROJ_DIR"
          cd "$PROJ_DIR"
          cat << 'EOF' >> gradle.properties

          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          EOF

          python3 - << 'PYEOF'
          import pathlib, re
          p = pathlib.Path("app/src/main/java/com/sumuw/launcher/ui/screens/SmartStackWidget.kt")
          txt = p.read_text(encoding="utf-8")
          txt = txt.replace("import android.icu.util.IslamicUmalquraCalendar", "import java.time.chrono.HijrahDate\nimport java.time.temporal.ChronoField")
          txt = re.sub(
              r"val cal = IslamicUmalquraCalendar\(\)[\s\S]*?val hijriYear = .*",
              "val hijrah = HijrahDate.now()\n    val hijriDay = hijrah.get(ChronoField.DAY_OF_MONTH)\n    val hijriMonthIdx = hijrah.get(ChronoField.MONTH_OF_YEAR) - 1\n    val hijriYear = hijrah.get(ChronoField.YEAR)",
              txt,
              count=1
          )
          p.write_text(txt, encoding="utf-8")
          PYEOF

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SumuwLauncher-debug-apk
          path: src_project/**/build/outputs/apk/**/*.apk
