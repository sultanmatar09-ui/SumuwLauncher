name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          mkdir -p src_project
          unzip -o "*.zip" -d src_project
          ls -la src_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          PROJ_DIR=$(find src_project -maxdepth 3 -name "settings.gradle*" -printf '%h\n' | head -n 1)
          echo "Project dir: $PROJ_DIR"
          cd "$PROJ_DIR" 
          echo "" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SumuwLauncher-debug-apk
          path: src_project/**/build/outputs/apk/**/*.apk
