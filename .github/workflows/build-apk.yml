name: Build Sumuw Native APK (SDK 35)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          mkdir -p src_project
          if [ -f "SumuwNative_v2.2_AMOLED_120Hz_UnifiedStack.zip" ]; then
            unzip -qo "SumuwNative_v2.2_AMOLED_120Hz_UnifiedStack.zip" -d src_project
          elif [ -f "SumuwNativeLauncher_SDK35.zip" ]; then
            unzip -qo "SumuwNativeLauncher_SDK35.zip" -d src_project
          elif [ -f "SaraHome-source-v3.12.zip" ]; then
            unzip -qo "SaraHome-source-v3.12.zip" -d src_project
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK 35 & Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SDK_MGR="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -x "$SDK_MGR" ]; then
            SDK_MGR="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDK_MGR" --licenses > /dev/null || true
          "$SDK_MGR" "platforms;android-35" "build-tools;35.0.0"

          BUILD_SH=$(find src_project -maxdepth 3 -name "build-apk.sh" | head -n 1)
          if [ -n "$BUILD_SH" ]; then
            PROJ_DIR=$(dirname "$BUILD_SH")
            echo "Building SaraHome/Sumuw v3.12 in: $PROJ_DIR"
            cd "$PROJ_DIR"
            chmod +x build-apk.sh
            ./build-apk.sh
          else
            PROJ_DIR=$(find src_project -maxdepth 3 -name "settings.gradle*" -printf '%h\n' | head -n 1)
            echo "Building Gradle project in: $PROJ_DIR"
            cd "$PROJ_DIR"
                    if [ -f "gradlew" ]; then chmod +x gradlew && ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SumuwNativeLauncher-apk
          path: |
            src_project/**/app/build/*.apk
            src_project/**/build/outputs/apk/**/*.apk
